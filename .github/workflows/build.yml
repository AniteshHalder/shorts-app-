cat > /home/claude/shorts_autopost/.github/workflows/build.yml << 'EOF'
name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack All Zips
        run: |
          find . -name "*.zip" -exec unzip -o {} +
          if [ -d "shorts_autopost" ]; then
            cp -r shorts_autopost/* .
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Compatible Version
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Upgrade Android Config
        run: |
          flutter create . --platforms=android --project-name shorts_autopost --org com.shortsautopost.app

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shorts-autopost-apk
          path: build/app/outputs/flutter-apk/app-release.apk
EOF
echo "written"
cat /home/claude/shorts_autopost/.github/workflows/build.yml
